groups:
  - name: api-observability
    interval: 30s
    rules:
      # Error rate: > 5% of requests returning 5xx over 5 minutes.
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "High 5xx error rate on the API"
          description: "More than 5% of requests failed with 5xx over the last 5 minutes."

      # Latency: p95 request duration above 1s for 5 minutes.
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "API p95 latency above 1s"
          description: "95th percentile request latency exceeded 1 second for 5 minutes."

      # Target missing: Prometheus hasn't scraped the app recently.
      - alert: MetricsMissing
        expr: |
          absent(up{job="api-observability-starter"} == 1)
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "API metrics target missing"
          description: "Prometheus has not scraped the API metrics endpoint for 5 minutes."
